server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API is proxied to the Go service. The upload directory is never exposed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    # Streaming answers (SSE): disable buffering end to end so deltas reach the
    # browser as they are produced, and allow a long-lived read.
    location ~ ^/api/conversations/[0-9]+/messages$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # OpenAPI document and Swagger UI are served by the Go service.
    location = /openapi.json {
        proxy_pass http://api:8080/openapi.json;
    }

    location /swagger/ {
        proxy_pass http://api:8080;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA history fallback: any non-API path returns index.html so deep links
    # like /materials/3 survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
