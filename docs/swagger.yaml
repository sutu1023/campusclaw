          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 读取本班 MCP 服务器（仅教师）
      tags:
      - mcp
    put:
      consumes:
      - application/json
      description: 修改地址/绑定立即失效且不自动重连；名称不可改，只能使用部署批准目标。
      parameters:
      - description: 服务器编号
