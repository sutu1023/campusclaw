basePath: /
definitions:
  auth.authErrorBody:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  auth.authLoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/auth.authUserBody'
    type: object
  auth.authMeResponse:
    properties:
      user:
        $ref: '#/definitions/auth.authUserBody'
    type: object
  auth.authOKResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  auth.authUserBody:
    properties:
      class_id:
        example: 1
        type: integer
      display_name:
        example: 教师 A
        type: string
      id:
        example: 1
        type: integer
      role:
        example: teacher
        type: string
      username:
        example: teacher_a
        type: string
    type: object
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  chat.Message:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  httpapi.ChunkParams:
    properties:
      chunk_collapse_ws:
        type: boolean
      chunk_max_chars:
        type: integer
      chunk_overlap_percent:
        type: integer
      chunk_separator:
        type: string
      chunk_strategy:
        type: string
      chunk_strip_links:
        type: boolean
    type: object
  httpapi.agentListResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/store.Agent'
        type: array
    type: object
  httpapi.agentRequest:
    properties:
      enabled:
        type: boolean
      material_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      prompt:
        type: string
      skill_ids:
        items:
          type: integer
        type: array
    type: object
  httpapi.askRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
      q:
        type: string
    type: object
  httpapi.askResponse:
    properties:
      answer:
        type: string
      citations:
        items:
          $ref: '#/definitions/httpapi.citation'
        type: array
      status:
        example: ok
        type: string
    type: object
  httpapi.citation:
    properties:
      chunk_id:
        type: integer
      chunk_index:
        type: integer
      end_offset:
        type: integer
      marker:
        type: string
      material_id:
        type: integer
      material_title:
        type: string
      start_offset:
        type: integer
    type: object
  httpapi.conversationDetailResponse:
    properties:
      conversation:
        $ref: '#/definitions/store.Conversation'
      messages:
        items:
          $ref: '#/definitions/httpapi.messageView'
        type: array
    type: object
  httpapi.conversationListResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/store.Conversation'
        type: array
    type: object
  httpapi.createConversationRequest:
    properties:
      agent_id:
        type: integer
    type: object
  httpapi.errorBody:
    properties:
      error:
        example: not found
        type: string
    type: object
  httpapi.exampleListResponse:
    properties:
      examples:
        items:
          $ref: '#/definitions/httpapi.exampleQuestion'
        type: array
    type: object
  httpapi.exampleQuestion:
    properties:
      no_evidence:
        type: boolean
      text:
        type: string
    type: object
  httpapi.materialDetailResponse:
    properties:
      body_text:
        type: string
      material:
        $ref: '#/definitions/store.Material'
    type: object
  httpapi.materialListResponse:
    properties:
      materials:
        items:
          $ref: '#/definitions/store.Material'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 3
        type: integer
    type: object
  httpapi.mcpApprovalRequest:
    properties:
      snapshot_hash:
        type: string
    type: object
  httpapi.mcpAuditResponse:
    properties:
      calls:
        items:
          $ref: '#/definitions/store.MCPToolCall'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httpapi.mcpRegistrationRequest:
    properties:
      base_url:
        example: http://mcp-demo:8090
        type: string
      name:
        example: campus-tools
        type: string
    type: object
  httpapi.mcpServerDTO:
    properties:
      approved_hash:
        type: string
      base_url:
        type: string
      class_id:
        type: integer
      created_at:
        type: string
      has_token:
        type: boolean
      id:
        type: integer
      last_error:
        type: string
      name:
        type: string
      pending_hash:
        type: string
      state:
        enum:
        - disconnected
        - connected
        - pending_approval
        type: string
      updated_at:
        type: string
    type: object
  httpapi.mcpServerListResponse:
    properties:
      servers:
        items:
          $ref: '#/definitions/httpapi.mcpServerDTO'
        type: array
    type: object
  httpapi.mcpToolsResponse:
    properties:
      approved_tools:
        items:
          $ref: '#/definitions/mcp.Tool'
        type: array
      change:
        $ref: '#/definitions/store.MCPDiscoveryChange'
      pending_tools:
        items:
          $ref: '#/definitions/mcp.Tool'
        type: array
      server:
        $ref: '#/definitions/httpapi.mcpServerDTO'
      tools:
        items:
          $ref: '#/definitions/mcp.Tool'
        type: array
    type: object
  httpapi.messageView:
    properties:
      citations:
        items:
          $ref: '#/definitions/httpapi.citation'
        type: array
      content:
        example: 移项怎么做
        type: string
      conversation_id:
        example: 1
        type: integer
      created_at:
        type: string
      id:
        example: 1
        type: integer
      role:
        example: user
        type: string
      skill_name:
        example: 数学解题引导
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/toolrun.CallSummary'
        type: array
    type: object
  httpapi.reindexResponse:
    properties:
      chunk_count:
        example: 4
        type: integer
      material_id:
        example: 1
        type: integer
    type: object
  httpapi.searchRequest:
    properties:
      limit:
        type: integer
      mode:
        type: string
      offset:
        type: integer
      q:
        type: string
    type: object
  httpapi.searchResponse:
    properties:
      hits:
        items:
          $ref: '#/definitions/retrieval.Hit'
        type: array
      message:
        type: string
      query_vector:
        items:
          type: number
        type: array
      status:
        type: string
    type: object
  httpapi.sendMessageRequest:
    properties:
      content:
        type: string
    type: object
  httpapi.skillListResponse:
    properties:
      skills:
        items:
          $ref: '#/definitions/store.Skill'
        type: array
    type: object
  httpapi.skillRequest:
    properties:
      source:
        type: string
    type: object
  httpapi.uploadResponse:
    properties:
      chunk_count:
        example: 4
        type: integer
      chunk_strategy:
        example: auto
        type: string
      indexing:
        type: string
      material_id:
        example: 1
        type: integer
      title:
        example: A 班-数学自学笔记
        type: string
    type: object
  httpapi.vectorChunkView:
    properties:
      chunk_id:
        example: 1
        type: integer
      chunk_index:
        example: 0
        type: integer
      dimension:
        example: 2048
        type: integer
      embedding_model:
        type: string
      end_offset:
        example: 17
        type: integer
      index_status:
        example: ready
        type: string
      knowledge_entry_id:
        example: 1
        type: integer
      material_id:
        example: 1
        type: integer
      material_title:
        example: A 班-数学自学笔记
        type: string
      payload:
        $ref: '#/definitions/httpapi.vectorPayload'
      start_offset:
        example: 0
        type: integer
    type: object
  httpapi.vectorPayload:
    properties:
      chunk_id:
        example: 1
        type: integer
      chunk_index:
        example: 0
        type: integer
      class_id:
        example: 1
        type: integer
      knowledge_entry_id:
        example: 1
        type: integer
      material_id:
        example: 1
        type: integer
    type: object
  httpapi.vectorResponse:
    properties:
      chunks:
        items:
          $ref: '#/definitions/httpapi.vectorChunkView'
        type: array
    type: object
  mcp.Tool:
    properties:
      description:
        type: string
      inputSchema:
        type: object
      name:
        type: string
    type: object
  retrieval.Hit:
    properties:
      chunk_id:
        type: integer
      chunk_index:
        type: integer
      end_offset:
        type: integer
      material_id:
        type: integer
      material_title:
        type: string
      score:
        type: number
      snippet:
        type: string
      start_offset:
        type: integer
    type: object
  store.Agent:
    properties:
      class_id:
        type: integer
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      material_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      prompt:
        type: string
      skill_ids:
        items:
          type: integer
        type: array
      updated_at:
        type: string
    type: object
  store.Conversation:
    properties:
      agent_id:
        type: integer
      class_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  store.MCPDiscoveryChange:
    properties:
      approved_at:
        type: string
      approved_by:
        type: integer
      changed_tools:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: integer
      previous_hash:
        type: string
      server_id:
        type: integer
      snapshot_hash:
        type: string
    type: object
  store.MCPToolCall:
    properties:
      call_id:
        type: string
      class_id:
        type: integer
      completed_at:
        type: string
      conversation_id:
        type: integer
      created_at:
        type: string
      duration_ms:
        type: integer
      id:
        type: integer
      question_message_id:
        type: integer
      ref:
        type: string
      round:
        type: integer
      server_id:
        type: integer
      server_name:
        type: string
      status:
        type: string
      text:
        type: string
      user_id:
        type: integer
    type: object
  store.Material:
    properties:
      class_id:
        type: integer
      created_at:
        type: string
      file_path:
        type: string
      id:
        type: integer
      title:
        type: string
      uploaded_by:
        type: integer
    type: object
  store.Skill:
    properties:
      class_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      source:
        type: string
      subject:
        type: string
      tools:
        items:
          type: string
        type: array
      trigger:
        type: string
      updated_at:
        type: string
    type: object
  toolrun.CallSummary:
    properties:
      call_id:
        example: q41-c1
        maxLength: 128
        type: string
      ref:
        example: formula_hint@campus-tools
        maxLength: 128
        type: string
      round:
        maximum: 64
        minimum: 0
        type: integer
      status:
        enum:
        - ok
        - error
        - denied
        type: string
      text:
        maxLength: 500
        type: string
    type: object
info:
  contact: {}
  description: CampusClaw 教学平台接口：认证、材料与检索、智能体与技能、流式会话、教师 MCP 管理/发现确认/审计。
  title: CampusClaw API
  version: "1.0"
paths:
  /api/agents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.agentListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 列出本班智能体
      tags:
      - agents
    post:
      consumes:
      - application/json
      parameters:
      - description: 智能体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.agentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 新建智能体
      tags:
      - agents
  /api/agents/{id}:
    get:
      parameters:
      - description: 智能体编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Agent'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 读取一个智能体
      tags:
      - agents
    put:
      consumes:
      - application/json
      parameters:
      - description: 智能体编号
        in: path
        name: id
        required: true
        type: integer
      - description: 智能体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.agentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 修改智能体
      tags:
      - agents
  /api/ask:
    post:
      consumes:
      - application/json
      parameters:
      - description: 问答请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.askRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.askResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 按本班资料作简短回答
      tags:
      - retrieval
  /api/conversations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.conversationListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 列出我的会话
      tags:
      - conversations
    post:
      consumes:
      - application/json
      parameters:
      - description: 智能体编号
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.createConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Conversation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 按智能体新建会话
      tags:
      - conversations
  /api/conversations/{id}:
    get:
      description: 同时校验用户和班级；助手消息包含按发生顺序保存的安全 tool_calls 摘要，旧 NULL/无工具消息读取为 []，不回放中间
        assistant/tool 协议消息。
      parameters:
      - description: 会话编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.conversationDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 读取会话和消息
      tags:
      - conversations
  /api/conversations/{id}/messages:
    post:
      consumes:
      - application/json
      description: 首次 meta 含 status=ok/skill/citations；后续每轮 meta 保持原字段并追加新增 tool_calls（call_id/ref/round/status/text），状态为
        ok/error/denied；工具记录全在首个 delta 前，无记录省略字段。done 指向已保存正文及摘要；工具局部失败不终止回答，主路径无正文失败用
        error，部分生成沿用保存/done。
      parameters:
      - description: 会话编号
        in: path
        name: id
        required: true
        type: integer
      - description: 提问
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.sendMessageRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 在会话中继续提问（SSE 流式）
      tags:
      - conversations
  /api/examples:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.exampleListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 列出示例问句
      tags:
      - retrieval
  /api/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录凭据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.authErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.authErrorBody'
      summary: 登录并签发访问令牌
      tags:
      - auth
  /api/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authOKResponse'
      security:
      - BearerAuth: []
      summary: 登出并吊销当前令牌
      tags:
      - auth
  /api/materials:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 标题筛选
        in: query
        name: title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.materialListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 分页列出本班材料
      tags:
      - materials
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 材料文件（.txt/.md）
        in: formData
        name: file
        required: true
        type: file
      - description: 标题
        in: formData
        name: title
        type: string
      - description: 切片策略：auto/custom/hierarchy
        in: formData
        name: chunk_strategy
        type: string
      - description: 自定义分隔符
        in: formData
        name: chunk_separator
        type: string
      - description: 最大切片长度
        in: formData
        name: chunk_max_chars
        type: integer
      - description: 重叠比例
        in: formData
        name: chunk_overlap_percent
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.uploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 教师上传本班材料
      tags:
      - materials
  /api/materials/{id}:
    get:
      parameters:
      - description: 材料编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
