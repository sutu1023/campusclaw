          schema:
            $ref: '#/definitions/httpapi.errorBody'
      security:
      - BearerAuth: []
      summary: 用技能文件改写技能
      tags:
      - skills
securityDefinitions:
  BearerAuth:
    description: 输入登录接口返回的应用令牌 "Bearer <token>"；不是 MCP Bearer。MCP 凭据只在服务器环境配置，浏览器无需输入或获取。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
